name: Cargo Build

on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: cargo build (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [dev, release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-14

      - name: Cache cargo directories
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ matrix.profile }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-${{ matrix.profile }}-

      - name: Fetch dependencies
        run: cargo fetch --locked

      - name: Run cargo build
        run: |
          if [ "${{ matrix.profile }}" = "release" ]; then
            cargo build --workspace --exclude ffi_c --locked --release
            cargo build -p ffi_c --lib --locked --release
          else
            cargo build --workspace --exclude ffi_c --locked
            cargo build -p ffi_c --lib --locked
          fi
