[workspace]
resolver = "3"
members = ["crates/domain", "crates/platform/ffi_c", "crates/platform/linux", "xtask"]

[workspace.dependencies]
bitflags = { version = "2.13.1" }
cbindgen = { version = "0.29.4" }
getset = { version = "0.1.7" }
microps = { path = "crates/domain" }
rand = { version = "0.10.2" }
signal-hook = { version = "0.4.4" }
slotmap = { version = "1.1.1", default-features = false }
thiserror = { version = "2.0.19", default-features = false }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
