[workspace]
resolver = "3"
members = ["crates/domain", "crates/platform/ffi_c", "crates/platform/linux", "xtask"]

[workspace.dependencies]
bitflags = { version = "2.6.0" }
cbindgen = { version = "0.29.0" }
getset = { version = "0.1.3" }
microps = { path = "crates/domain" }
rand = { version = "0.9.2" }
signal-hook = { version = "0.3.18" }
slotmap = { version = "1.1.1", default-features = false }
thiserror = { version = "2.0.12", default-features = false }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
